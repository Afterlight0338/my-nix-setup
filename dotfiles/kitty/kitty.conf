
# Always launch Zsh.
shell /run/current-system/sw/bin/zsh
env SHELL=/run/current-system/sw/bin/zsh

# Translucent background, Hyprland blurs what's behind it
background_opacity 0.65
dynamic_background_opacity yes
window_padding_width 10

# Heavier, higher-contrast glyphs so text holds up on the translucent background
text_composition_strategy 1.7 30


# Darker toward the top, fading out by the bottom (top-shade.png is a transparent gradient)
background_image top-shade.png
background_image_layout scaled

# Cursor trail: a short smear when the cursor jumps (typing doesn't trigger it, only jumps of 2+ cells)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
